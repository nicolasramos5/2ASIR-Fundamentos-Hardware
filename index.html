
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hola Pedro</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2, #ff758c);
        }

        .tarjeta {
            background: white;
            padding: 50px 70px;
            border-radius: 25px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            animation: aparecer 1.2s ease;
        }

        h1 {
            color: #764ba2;
            font-size: 45px;
            margin-bottom: 10px;
        }

        p {
            color: #666;
            font-size: 18px;
        }

        button {
            background: linear-gradient(90deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 14px 30px;
            border-radius: 30px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.3s;
        }

        button:hover {
            transform: scale(1.1);
        }

        @keyframes aparecer {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <div class="tarjeta">
        <h1>👋 ¡Hola Pedro!</h1>
        <p>¡Bienvenido a esta página web!</p>
        <button onclick="alert('¡Un saludo, Pedro! 🎉')">
            ¡Haz clic aquí!
        </button>
    </div>

</body>
</html>
